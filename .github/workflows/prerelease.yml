name: Alpha
run-name: Alpha · ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: surfing-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'AstraSolis/Surfing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release contracts
        run: |
          python tools/release.py check
          python -m unittest discover -s tests -p test_release.py -v
      - name: Build manual-test Alpha
        run: sh build.sh --channel alpha
      - name: Preserve verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: Surfing-alpha-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/alpha/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
