name: Release
run-name: Stable · ${{ github.ref_name }}

on:
  push:
    tags: ['v*-astra.*']

permissions:
  contents: read

concurrency:
  group: surfing-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'AstraSolis/Surfing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check tag and release contracts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/release.py check --tag "$RELEASE_TAG"
          python -m unittest discover -s tests -p test_release.py -v
      - name: Build stable bundle
        run: sh build.sh --channel stable
      - name: Preserve verified bundle before publishing
        uses: actions/upload-artifact@v4
        with:
          name: Surfing-stable-${{ github.ref_name }}-${{ github.run_attempt }}
          path: dist/stable/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload draft, verify all assets, then publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py dist/stable
